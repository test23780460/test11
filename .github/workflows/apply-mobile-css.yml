name: Apply Mobile Friendly CSS
on:
  push:
    paths:
      - .github/workflows/apply-mobile-css.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mobile CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          payload = ''
          css = base64.b64decode(payload).decode('utf-8')
          if '.mobileOnly{display:none}@media(max-width:760px)' not in html:
              html = html.replace('</style></head>', css + '</style></head>')
              path.write_text(html, encoding='utf-8')
          PY
      - name: Commit mobile CSS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-mobile-css.yml
          git add index.html
          git commit -m "Improve mobile layout" || exit 0
          git push
