name: Patch optional accounts

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-optional-accounts.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch optional accounts
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('index.html')
          lines = path.read_text().splitlines()
          new_safe = r'''function safeAccount(){try{return localStorage.getItem('activeAccount')||''}catch(e){return''}}function accountKey(k){return activeAccount?`account:${activeAccount}:${k}`:k}function accountLabel(){return activeAccount||'Guest'}function safeList(k,d){try{const v=JSON.parse(localStorage.getItem(k)||'null');return Array.isArray(v)&&v.length?v:d.slice()}catch(e){return d.slice()}}function save(){localStorage.setItem(accountKey('watchlist'),JSON.stringify(saved));localStorage.setItem(accountKey('cryptoWatchlist'),JSON.stringify(cryptoSaved));updateAccountButton()}function listAccounts(){try{return JSON.parse(localStorage.getItem('accounts')||'[]').filter(Boolean)}catch(e){return[]}}function writeAccounts(a){localStorage.setItem('accounts',JSON.stringify([...new Set(a)].sort((x,y)=>x.localeCompare(y))))}function loadAccountLists(){saved=safeList(accountKey('watchlist'),DEFAULTS);cryptoSaved=safeList(accountKey('cryptoWatchlist'),DEFAULT_CRYPTO);save();updateAccountButton();render();refreshMissing()}function updateAccountButton(){const b=$('accountBtn');if(b)b.textContent=activeAccount?`Account: ${activeAccount}`:'Guest'}function setAccount(name){name=String(name||'').trim().replace(/[<>'"]/g,'').slice(0,24);if(!name)return;const accounts=listAccounts();if(!accounts.includes(name)){writeAccounts([...accounts,name]);if(!localStorage.getItem(`account:${name}:watchlist`))localStorage.setItem(`account:${name}:watchlist`,JSON.stringify(saved));if(!localStorage.getItem(`account:${name}:cryptoWatchlist`))localStorage.setItem(`account:${name}:cryptoWatchlist`,JSON.stringify(cryptoSaved))}activeAccount=name;localStorage.setItem('activeAccount',name);closeModal();loadAccountLists()}function signOutAccount(){activeAccount='';localStorage.removeItem('activeAccount');closeModal();loadAccountLists()}function deleteAccount(name){name=String(name||'').replace(/[<>'"]/g,'');if(!name)return;writeAccounts(listAccounts().filter(a=>a!==name));localStorage.removeItem(`account:${name}:watchlist`);localStorage.removeItem(`account:${name}:cryptoWatchlist`);if(activeAccount===name){activeAccount='';localStorage.removeItem('activeAccount');loadAccountLists()}openAccount()}function openAccount(){const accounts=listAccounts();$('modalBody').innerHTML=`<div class="line"><div><div class="sym">Accounts</div><div class="muted">${activeAccount?'Signed in as '+esc(activeAccount):'Using guest mode'}</div></div><button class="btn" onclick="closeModal()">Close</button></div><p class="accountNote">Accounts are optional and saved on this browser. They keep each person's stock and crypto watchlists separate without changing the public scanner.</p><div class="accountGrid"><div class="accountBox"><h3>Create or sign in</h3><input id="accountNameInput" class="input" placeholder="Account name" maxlength="24" style="width:100%;margin-bottom:8px"><button class="btn primary" style="width:100%" onclick="setAccount($('accountNameInput').value)">Use Account</button></div><div class="accountBox"><h3>Saved accounts</h3><div class="accountList">${accounts.length?accounts.map(a=>`<div class="line"><button class="btn" onclick="setAccount('${esc(a)}')">${esc(a)}</button><button class="btn danger" onclick="deleteAccount('${esc(a)}')">Delete</button></div>`).join(''):'<span class="muted">No saved accounts yet.</span>'}</div></div></div><div class="actions" style="margin-top:12px"><button class="btn" onclick="signOutAccount()">Continue as Guest</button></div>`;$('modal').classList.add('open');setTimeout(()=>{$('accountNameInput')?.focus()},50)}function fmt(n){if(!Number.isFinite(n))return'--';const d=Math.abs(n)<1?4:Math.abs(n)<10?3:2;return'$'+n.toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d})}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function uniq(a){return[...new Set(a)]}function compact(n){return n>1e9?(n/1e9).toFixed(1)+'B':n>1e6?(n/1e6).toFixed(1)+'M':n>1e3?(n/1e3).toFixed(1)+'K':n||'--'}'''
          new_bottom = r'''function showPage(name,btn){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));$(name+'Page').classList.add('active');document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));if(btn)btn.classList.add('active');window.scrollTo({top:0,behavior:'smooth'})}function closeModal(){$('modal').classList.remove('open')}$('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};$('addBtn').onclick=()=>addStock($('stockInput').value);$('cryptoAddBtn').onclick=()=>addCrypto($('cryptoInput').value);$('stockInput').onkeydown=e=>{if(e.key==='Enter')addStock(e.target.value)};$('cryptoInput').onkeydown=e=>{if(e.key==='Enter')addCrypto(e.target.value)};$('refreshBtn').onclick=load;$('sort').onchange=()=>renderWatch(saved.map(s=>bySym.get(s)).filter(Boolean),'stockWatch',false);$('filter').onchange=()=>renderWatch(saved.map(s=>bySym.get(s)).filter(Boolean),'stockWatch',false);window.showPage=showPage;window.openAsset=openAsset;window.closeModal=closeModal;window.addStock=addStock;window.addCrypto=addCrypto;window.removeStock=removeStock;window.removeCrypto=removeCrypto;window.toggleTheme=toggleTheme;window.openAccount=openAccount;window.setAccount=setAccount;window.signOutAccount=signOutAccount;window.deleteAccount=deleteAccount;setThemeButton();updateAccountButton();load();setInterval(load,300000);'''
          for i,line in enumerate(lines):
              if line.startswith('.newsGrid') and 'accountGrid' not in line:
                  lines[i] = line.replace('.sentimentMixed{color:var(--gold)}', '.sentimentMixed{color:var(--gold)}.accountGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.accountBox{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:12px}.accountList{display:grid;gap:8px;margin-top:10px}.accountList button{text-align:left}.accountNote{font-size:12px;color:var(--muted);line-height:1.45}').replace('@media(max-width:700px){.newsGrid{grid-template-columns:1fr}}', '@media(max-width:700px){.newsGrid,.accountGrid{grid-template-columns:1fr}}')
              elif line.startswith('<header class="top">') and 'accountBtn' not in line:
                  lines[i] = line.replace('<button id="themeBtn" class="btn" onclick="toggleTheme()">Light</button>', '<button id="accountBtn" class="btn" onclick="openAccount()">Guest</button><button id="themeBtn" class="btn" onclick="toggleTheme()">Light</button>')
              elif line.startswith('let saved='):
                  lines[i] = line.replace('let saved=', 'let activeAccount=safeAccount(),saved=')
                  lines[i] = lines[i].replace("safeList('watchlist',DEFAULTS)", "safeList(accountKey('watchlist'),DEFAULTS)")
                  lines[i] = lines[i].replace("safeList('cryptoWatchlist',DEFAULT_CRYPTO)", "safeList(accountKey('cryptoWatchlist'),DEFAULT_CRYPTO)")
              elif line.startswith('function safeList('):
                  lines[i] = new_safe
              elif line.startswith('function showPage('):
                  lines[i] = new_bottom
          text = '\n'.join(lines) + '\n'
          if 'accountBtn' not in text or 'function openAccount' not in text:
              raise SystemExit('account patch did not apply')
          path.write_text(text)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add optional local accounts" || exit 0
          git push
