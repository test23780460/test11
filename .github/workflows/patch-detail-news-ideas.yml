name: Patch detail news and suggested pages
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/patch-detail-news-ideas.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          css_add = ".split{display:grid;grid-template-columns:1.15fr .85fr;gap:12px}.pillRow{display:flex;gap:7px;flex-wrap:wrap}.ideaCard{min-height:360px}.ideaHeader{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.scoreBadge{width:64px;height:64px;border-radius:8px;border:1px solid var(--line);background:conic-gradient(from 180deg,var(--green) calc(var(--score)*1%),var(--soft) 0);display:grid;place-items:center;font-weight:950}.planList{display:grid;gap:8px}.planStep{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:9px}.impactMeter{height:10px;background:var(--soft);border-radius:999px;overflow:hidden;border:1px solid var(--line)}.impactMeter i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold),var(--green))}.detailGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.detailPanel{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:12px}.detailPanel h3{margin:0 0 8px}.newsMini{display:grid;gap:8px}.newsMini a{color:var(--ink);text-decoration:none}.newsMini a:hover{color:var(--green)}"
          if '.scoreBadge{' not in text:
            text = text.replace('.accountNote{font-size:12px;color:var(--muted);line-height:1.45}@media(max-width:1100px){.newsGrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.newsGrid,.accountGrid{grid-template-columns:1fr}}', '.accountNote{font-size:12px;color:var(--muted);line-height:1.45}' + css_add + '@media(max-width:1100px){.newsGrid{grid-template-columns:repeat(2,1fr)}.split,.detailGrid{grid-template-columns:1fr}}@media(max-width:700px){.newsGrid,.accountGrid{grid-template-columns:1fr}.scoreBadge{width:54px;height:54px}.ideaHeader{flex-direction:column}}')

          ideas_html = r'''<section id="ideasPage" class="grid page"><section class="panel span12"><div class="section"><h3>Suggested Research Dashboard</h3><span class="muted">Chart score + news impact + risk plan</span></div><div id="ideaKpis" class="kpis"></div></section><section class="panel span12"><div class="section"><h3>Best Setups Right Now</h3><span class="muted">Click a card for the full detail plan</span></div><div id="ideaCards" class="cards"></div></section><section class="panel span12"><div class="section"><h3>Research Queue</h3><span class="muted">Why, when, and invalidation</span></div><div class="tableWrap"><table><thead><tr><th>Rank</th><th>Asset</th><th>Setup</th><th>Total</th><th>News</th><th>Risk</th><th>Why</th><th>When to consider</th><th>Invalid if</th></tr></thead><tbody id="ideaRows"></tbody></table></div></section></section>
'''
          text = re.sub(r'<section id="ideasPage" class="grid page">.*?</section>\n(?=<section id="newsPage")', ideas_html, text, count=1, flags=re.S)

          news_html = r'''<section id="newsPage" class="grid page"><section class="panel span12"><div class="section"><h3>News Impact Desk</h3><span class="muted" id="newsUpdated">Waiting for backend news</span></div><div id="newsKpis" class="kpis"></div></section><section class="panel span12"><div class="section"><h3>Impact Leaders</h3><span class="muted">News tone checked against chart setup</span></div><div id="newsImpactCards" class="cards"></div></section><section class="panel span12"><div class="section"><h3>Headlines The Scanner Is Watching</h3><span class="muted">News tone plus chart confirmation, not financial advice</span></div><div id="newsCards" class="newsGrid"></div></section><section class="panel span12"><div class="section"><h3>News Impact Table</h3><span class="muted">Ranked by sentiment, AI score, and confidence</span></div><div class="tableWrap"><table><thead><tr><th>Asset</th><th>Impact</th><th>News Tone</th><th>AI</th><th>Confidence</th><th>Price Move</th><th>Prediction</th><th>Headline</th></tr></thead><tbody id="newsRows"></tbody></table></div></section></section>
'''
          text = re.sub(r'<section id="newsPage" class="grid page">.*?</section>\n(?=<section id="backendPage")', news_html, text, count=1, flags=re.S)

          helpers = r'''function newsForSymbol(sym){return(news?.headlines||[]).filter(n=>n.symbol===sym).sort((a,b)=>newsRank(b)-newsRank(a))}function newsImpactFor(r){const items=newsForSymbol(r.symbol),avgTone=items.length?items.slice(0,5).reduce((a,n)=>a+(n.sentiment?.score||50),0)/Math.min(5,items.length):50,latest=items[0],tonePush=(avgTone-50)*.7,agreement=(avgTone>=58&&r.changePct>=0)||(avgTone<=42&&r.changePct<0)?10:0,attention=Math.min(12,items.length*2),impact=clamp(Math.round(50+tonePush+agreement+attention),1,99),label=impact>=68?'Supportive':impact<=38?'Pressure':'Mixed';return{score:impact,label,avgTone:Math.round(avgTone),count:items.length,latest,items}}function totalScore(r){const ni=newsImpactFor(r),risk=riskScore(r),total=clamp(Math.round(aiScore(r)*.48+confidence(r)*.24+ni.score*.22-risk*.14+8),1,99);return total}function setupPlan(r){const p=levels(r),s=signal(r),ni=newsImpactFor(r),risk=riskScore(r);const entry=s.key==='dip'?`Wait for buyers to reclaim ${fmt(p.trigger)} after the dip. Do not chase while it is still sliding.`:s.key==='momentum'?`Look for continuation above ${fmt(p.trigger)} or a calm pullback that holds ${fmt(p.avg)}.`:s.key==='peak'?`Let it cool off first. Only research a new entry if it resets and then reclaims ${fmt(p.trigger)}.`:`Best near ${fmt(p.dipZone)} with stability, or above ${fmt(p.trigger)} with strength.`;const sizing=risk>=72?'Tiny test only because risk is high.':risk>=55?'Small position idea until the chart proves itself.':'Normal research sizing, still with a hard invalidation.';const newsLine=ni.count?`${ni.label} news impact: ${ni.avgTone}/95 average tone from ${ni.count} headline${ni.count===1?'':'s'}.`:'No fresh headline data yet, so use chart levels first.';return{entry,sizing,news:newsLine,exit:`Invalid if price loses ${fmt(p.stop)}. First target area ${fmt(p.target)}.`}}function newsImpactPill(ni){const cls=ni.score>=68?'dip':ni.score<=38?'peak':'neutral';return`<span class="tag ${cls}">News ${ni.score} ${ni.label}</span>`}function detailNewsBlock(r){const ni=newsImpactFor(r),items=ni.items.slice(0,4);return`<div class="detailPanel"><div class="line"><h3>News Impact</h3>${newsImpactPill(ni)}</div><div class="impactMeter"><i style="width:${ni.score}%"></i></div><p class="muted">${ni.count?`Latest read: ${ni.label}. Average tone ${ni.avgTone}/95 across ${ni.count} tracked headline${ni.count===1?'':'s'}.`:'No saved news for this symbol yet.'}</p><div class="newsMini">${items.length?items.map(n=>`<div><a href="${esc(n.link||'#')}" target="_blank" rel="noopener noreferrer"><b>${esc(n.title)}</b></a><div class="muted">${esc(n.publisher||'Yahoo Finance')} | ${newsTime(n.publishedAt)} | ${n.sentiment?.label||'mixed'} ${n.sentiment?.score||50}</div></div>`).join(''):'<span class="muted">Headlines will show here after the backend sees this asset in news.</span>'}</div></div>`}function detailPlanBlock(r){const plan=setupPlan(r);return`<div class="detailPanel"><h3>Watch Plan</h3><div class="planList"><div class="planStep"><b>Entry idea</b><div class="muted">${plan.entry}</div></div><div class="planStep"><b>Size idea</b><div class="muted">${plan.sizing}</div></div><div class="planStep"><b>News check</b><div class="muted">${plan.news}</div></div><div class="planStep"><b>Exit</b><div class="muted">${plan.exit}</div></div></div></div>`}
'''
          if 'function newsForSymbol(sym)' not in text:
            text = text.replace('function renderIdeas(all){', helpers + 'function renderIdeas(all){', 1)

          render_ideas = r'''function renderIdeas(all){const ranked=[...all].sort((a,b)=>totalScore(b)-totalScore(a));const best=ranked[0],dipCount=ranked.filter(r=>signal(r).key==='dip').length,newsBacked=ranked.filter(r=>newsImpactFor(r).score>=68).length,lowRisk=ranked.filter(r=>riskScore(r)<55).length;if($('ideaKpis'))$('ideaKpis').innerHTML=[metric('Top idea',best?clean(best.symbol)+' '+totalScore(best):'--','gold'),metric('Dip ideas',dipCount,'up'),metric('News backed',newsBacked,'cyan'),metric('Lower risk',lowRisk,'blue'),metric('Scanned',ranked.length,'violet')].join('');$('ideaCards').innerHTML=ranked.slice(0,12).map(r=>{const p=levels(r),ni=newsImpactFor(r),plan=setupPlan(r),total=totalScore(r);return`<div class="asset ideaCard" onclick="openAsset('${r.symbol}')"><div class="ideaHeader"><div><b class="sym">${clean(r.symbol)}</b><div class="muted">${bucket(r)} | ${fmt(r.price)} <span class="${r.changePct>=0?'up':'down'}">${pct(r.changePct)}</span></div></div><div class="scoreBadge" style="--score:${total}">${total}</div></div><div class="pillRow"><span class="tag ${isCrypto(r.symbol)?'cryptoTag':signal(r).cls}">${signal(r).label}</span>${newsImpactPill(ni)}<span class="tag neutral">Risk ${riskScore(r)}</span></div><div class="bar"><i style="width:${total}%"></i></div><p class="muted"><b>Why:</b> ${whyInvest(r)} ${plan.news}</p><p class="muted"><b>When:</b> ${plan.entry}</p><div class="stats"><div class="stat"><small>Trigger</small><b>${fmt(p.trigger)}</b></div><div class="stat"><small>Invalid</small><b>${fmt(p.stop)}</b></div><div class="stat"><small>Target</small><b>${fmt(p.target)}</b></div><div class="stat"><small>News</small><b>${ni.score}</b></div></div></div>`}).join('');$('ideaRows').innerHTML=ranked.map((r,i)=>{const p=levels(r),ni=newsImpactFor(r);return`<tr onclick="openAsset('${r.symbol}')"><td>${i+1}</td><td><b>${clean(r.symbol)}</b><div class="muted">${esc(r.name||'')}</div></td><td>${bucket(r)}</td><td>${totalScore(r)}</td><td>${ni.score} ${ni.label}</td><td>${riskScore(r)}</td><td>${whyInvest(r)}</td><td>${setupPlan(r).entry}</td><td>Below ${fmt(p.stop)}</td></tr>`}).join('')}'''
          text = re.sub(r'^function renderIdeas\(all\).*$' , render_ideas, text, count=1, flags=re.M)

          render_news = r'''function newsClass(label){return label==='bullish'?'sentimentBull':label==='bearish'?'sentimentBear':'sentimentMixed'}function newsRank(item){const tone=Math.abs((item.sentiment?.score||50)-50)*1.2,score=item.aiScore||50,conf=item.confidence||50,move=Math.min(18,Math.abs(item.changePct||0)*3);return tone+score*.55+conf*.35+move}function newsTime(v){if(!v)return'New';try{return new Date(v).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}catch(e){return'New'}}function renderNews(){const items=(news?.headlines||[]).filter(Boolean).sort((a,b)=>newsRank(b)-newsRank(a));const updated=news?.updatedAt?new Date(news.updatedAt).toLocaleString():'Waiting for the next backend run';if($('newsUpdated'))$('newsUpdated').textContent=updated;if(!items.length){$('newsKpis').innerHTML=[metric('Headlines','Waiting','gold'),metric('News mood','No data yet','muted'),metric('Bullish',0,'up'),metric('Bearish',0,'down'),metric('Mixed',0,'gold')].join('');if($('newsImpactCards'))$('newsImpactCards').innerHTML='<div class="asset muted">Impact leaders will appear after the next backend update.</div>';$('newsCards').innerHTML='<div class="newsCard muted">News predictions will appear after the next backend update creates data/news.json.</div>';$('newsRows').innerHTML='';return}const mood=news?.marketRead||'News is mixed',symbols=[...new Set(items.map(i=>i.symbol))].map(s=>bySym.get(s)).filter(Boolean).sort((a,b)=>newsImpactFor(b).score-newsImpactFor(a).score);$('newsKpis').innerHTML=[metric('Headlines',news?.totalHeadlines||items.length,'cyan'),metric('News mood',mood,(news?.avgSentiment||50)>=62?'up':(news?.avgSentiment||50)<=40?'down':'gold'),metric('Bullish',news?.bullish||0,'up'),metric('Bearish',news?.bearish||0,'down'),metric('Avg tone',(news?.avgSentiment||50)+'/95','violet')].join('');if($('newsImpactCards'))$('newsImpactCards').innerHTML=symbols.slice(0,8).map(r=>{const ni=newsImpactFor(r),latest=ni.latest;return`<div class="asset" onclick="openAsset('${r.symbol}')"><div class="line"><b class="sym">${clean(r.symbol)}</b><span class="tag ${ni.score>=68?'dip':ni.score<=38?'peak':'neutral'}">${ni.score}</span></div><div class="muted">${esc(r.name||'')} | ${fmt(r.price)} <span class="${r.changePct>=0?'up':'down'}">${pct(r.changePct)}</span></div><div class="impactMeter"><i style="width:${ni.score}%"></i></div><p class="muted"><b>${ni.label}:</b> ${ni.count} headline${ni.count===1?'':'s'}, average tone ${ni.avgTone}/95.</p><p class="muted">${latest?esc(latest.prediction||latest.title):'Waiting for a matching headline.'}</p></div>`}).join('');$('newsCards').innerHTML=items.slice(0,18).map(item=>{const r=bySym.get(item.symbol),ni=r?newsImpactFor(r):{score:50,label:'Mixed'};return`<article class="newsCard"><div class="newsMeta"><span class="tag ${newsClass(item.sentiment?.label)}">${item.sentiment?.label||'mixed'} ${item.sentiment?.score||50}</span><span class="tag ${isCrypto(item.symbol)?'cryptoTag':(r?signal(r).cls:'neutral')}">${clean(item.symbol)}</span><span class="tag neutral">Impact ${ni.score}</span></div><h4><a href="${esc(item.link||'#')}" target="_blank" rel="noopener noreferrer">${esc(item.title)}</a></h4><p>${esc(item.publisher||'Yahoo Finance')} | ${newsTime(item.publishedAt)}</p><div class="stats"><div class="stat"><small>AI</small><b>${item.aiScore||'--'}</b></div><div class="stat"><small>Conf.</small><b>${item.confidence||'--'}%</b></div><div class="stat"><small>Move</small><b class="${(item.changePct||0)>=0?'up':'down'}">${pct(item.changePct)}</b></div><div class="stat"><small>Price</small><b>${fmt(item.price)}</b></div></div><p class="newsImpact"><b>Prediction:</b> ${esc(item.prediction||'Watch for price confirmation before acting on the news.')}</p></article>`}).join('');$('newsRows').innerHTML=items.map(item=>{const r=bySym.get(item.symbol),ni=r?newsImpactFor(r):{score:50,label:'Mixed'};return`<tr onclick="openAsset('${item.symbol}')"><td><b>${clean(item.symbol)}</b><div class="muted">${esc(item.name||'')}</div></td><td>${ni.score} ${ni.label}</td><td><span class="tag ${newsClass(item.sentiment?.label)}">${item.sentiment?.label||'mixed'} ${item.sentiment?.score||50}</span></td><td>${item.aiScore||'--'}</td><td>${item.confidence||'--'}%</td><td class="${(item.changePct||0)>=0?'up':'down'}">${pct(item.changePct)}</td><td>${esc(item.prediction||'Wait for price confirmation.')}</td><td><a href="${esc(item.link||'#')}" target="_blank" rel="noopener noreferrer">${esc(item.title)}</a><div class="muted">${esc(item.publisher||'Yahoo Finance')} | ${newsTime(item.publishedAt)}</div></td></tr>`}).join('')}'''
          text = re.sub(r'^function newsClass\(label\).*$' , render_news, text, count=1, flags=re.M)

          open_asset = r'''function openAsset(sym){const r=bySym.get(sym);if(!r)return;const s=signal(r),p=levels(r),fn=isCrypto(sym)?'addCrypto':'addStock',rm=isCrypto(sym)?'removeCrypto':'removeStock',ni=newsImpactFor(r),total=totalScore(r),plan=setupPlan(r);$('modalBody').innerHTML=`<div class="line"><div><div class="sym">${clean(r.symbol)}</div><div class="muted">${esc(r.name||'')}</div></div><button class="btn" onclick="closeModal()">Close</button></div><div class="line" style="margin:12px 0"><div><div class="price">${fmt(r.price)}</div><div class="${r.changePct>=0?'up':'down'}">${pct(r.changePct)}</div></div><div class="pillRow"><span class="tag ${isCrypto(r.symbol)?'cryptoTag':s.cls}">${s.label}</span><span class="tag gold">Total ${total}</span>${newsImpactPill(ni)}</div></div><canvas id="bigChart" class="bigChart" width="1000" height="310"></canvas><div class="stats"><div class="stat"><small>Total Score</small><b>${total}</b></div><div class="stat"><small>AI Score</small><b>${aiScore(r)}</b></div><div class="stat"><small>Confidence</small><b>${confidence(r)}%</b></div><div class="stat"><small>News Impact</small><b>${ni.score}</b></div><div class="stat"><small>Peak Risk</small><b>${riskScore(r)}</b></div><div class="stat"><small>Volume</small><b>${compact(r.volume)}</b></div><div class="stat"><small>Trigger</small><b>${fmt(p.trigger)}</b></div><div class="stat"><small>Invalid</small><b>${fmt(p.stop)}</b></div><div class="stat"><small>Target</small><b>${fmt(p.target)}</b></div><div class="stat"><small>RSI</small><b>${r.rsi.toFixed(0)}</b></div><div class="stat"><small>Support</small><b>${fmt(p.support)}</b></div><div class="stat"><small>Resistance</small><b>${fmt(p.resistance)}</b></div></div><div class="detailGrid">${detailPlanBlock(r)}${detailNewsBlock(r)}</div><div class="detailGrid"><div class="detailPanel"><h3>Why Research This</h3><p class="muted">${whyInvest(r)}</p><p class="muted">${plan.news}</p></div><div class="detailPanel"><h3>Level Map</h3><p class="muted">Dip zone ${fmt(p.dipZone)} | Average ${fmt(p.avg)} | Support ${fmt(p.support)} | Resistance ${fmt(p.resistance)}</p><p class="muted">Use the trigger for confirmation and the invalid level as the "this idea is wrong" line.</p></div></div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="${fn}('${r.symbol}')">Watch</button><button class="btn danger" onclick="${rm}('${r.symbol}')">Remove</button></div>`;$('modal').classList.add('open');setTimeout(()=>draw($('bigChart'),r,false))}'''
          text = re.sub(r'^function openAsset\(sym\).*$' , open_asset, text, count=1, flags=re.M)

          required = ['Suggested Research Dashboard','Impact Leaders','function newsForSymbol(sym)','Total Score','Watch Plan']
          missing = [x for x in required if x not in text]
          if missing:
            raise SystemExit('Patch failed, missing: ' + ', '.join(missing))
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Upgrade stock details news impact and suggestions" || exit 0
          git push
