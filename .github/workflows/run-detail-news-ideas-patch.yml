name: Run detail news and ideas patch
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/run-detail-news-ideas-patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and run patch script
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/patch-detail-news-ideas.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(source) if "python - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          script = textwrap.dedent('\n'.join(source[start:end]))
          exec(compile(script, 'extracted_patch.py', 'exec'))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Upgrade stock details news impact and suggestions" || exit 0
          git push
