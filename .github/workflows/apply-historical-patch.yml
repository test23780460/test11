name: Apply historical patch

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/apply-historical-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch historical support
        run: python .github/scripts/add_historical.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html scripts/update-stock-data.js .github/workflows/update-stock-data.yml
          git commit -m "Add historical data for predictions" || exit 0
          git push
