name: Apply historical patch

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/apply-historical-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Make sure historical support is patched
        run: python .github/scripts/add_historical.py
      - name: Refresh historical market data
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node scripts/update-stock-data.js
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json prices.csv data/market.json data/market.csv data/history.json data/history.csv data/alerts.json data/news.json data/historical.json
          git commit -m "Update historical market data" || exit 0
          git push
# trigger: historical-data-refresh
