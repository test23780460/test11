name: Apply Command Deck Upgrade
on:
  push:
    paths:
      - .github/workflows/apply-command-deck.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          deck_css = r'''
.deckLead{min-height:260px}.deckMeter{height:214px}.heatWall{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}.heatTile{border:1px solid var(--line);border-radius:8px;background:var(--soft);padding:10px;min-height:92px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 0 calc(var(--glow,50)*.25px) color-mix(in srgb,var(--tone,var(--green)) 40%,transparent);border-color:color-mix(in srgb,var(--tone,var(--green)) 48%,var(--line))}.heatTile b{font-size:18px}.heatTile small{color:var(--muted)}.flagList{display:grid;gap:8px}.flag{border:1px solid var(--line);border-radius:8px;background:var(--soft);padding:9px}.flag strong{display:block;margin-bottom:3px}.paperGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.battleGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.battleCell{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:10px;text-align:center}.battleCell b{display:block}.beginnerOn .proTerm{display:none}.beginnerOff .simpleTerm{display:none}@media(max-width:1100px){.heatWall{grid-template-columns:repeat(4,1fr)}}@media(max-width:700px){.paperGrid,.battleGrid{grid-template-columns:1fr}.heatWall{grid-template-columns:repeat(2,1fr)}}
'''
          deck_page = r'''
<section id="deckPage" class="grid page"><section class="panel span12"><div class="section"><h3>Market Command Deck</h3><div class="tools"><button id="beginnerBtn" class="btn">Beginner Mode</button><button class="btn primary" onclick="refreshLivePrices()">Run Scan</button></div></div><div id="deckKpis" class="kpis"></div></section><section class="panel span8 deckLead"><div class="section"><h3>Signal Of The Day</h3><span class="muted">Best blend of setup, news, risk, and confidence</span></div><div id="signalDay"></div></section><aside class="panel span4 deckLead"><div class="section"><h3>Should I Watch This?</h3><span class="muted">Watch / Wait / Avoid</span></div><div class="predictForm" style="grid-template-columns:1fr auto"><input id="deckAnalyzeInput" class="input" placeholder="Ticker, like TSLA or BTC"><button id="deckAnalyzeBtn" class="btn primary">Analyze</button></div><div id="deckAnalyzeResult" class="detailPanel" style="margin-top:10px"><p class="muted">Enter a stock or crypto symbol to get a simple verdict.</p></div></aside><section class="panel span12"><div class="section"><h3>Heat Map Wall</h3><span class="muted">Glows by total strength, turns red when risk is high</span></div><div id="heatWall" class="heatWall"></div></section><section class="panel span4"><div class="section"><h3>Whale Radar</h3><span class="muted">Crypto volatility proxy</span></div><div id="whaleRadar" class="list"></div></section><section class="panel span4"><div class="section"><h3>Hype Vs Risk</h3><span class="muted">Attention compared with danger</span></div><div id="hypeRisk" class="list"></div></section><section class="panel span4"><div class="section"><h3>Red Flag Detector</h3><span class="muted">Safety first</span></div><div id="redFlags" class="flagList"></div></section><section class="panel span8"><div class="section"><h3>Prediction Battle Cards</h3><span class="muted">Compare two assets</span></div><div class="predictForm" style="grid-template-columns:1fr 1fr auto"><input id="battleA" class="input" placeholder="TSLA"><input id="battleB" class="input" placeholder="NVDA"><button id="battleBtn" class="btn primary">Compare</button></div><div id="battleResult" style="margin-top:10px"></div></section><aside class="panel span4"><div class="section"><h3>Beginner Notes</h3><span class="muted">Simple explanations</span></div><div id="beginnerNotes" class="list"></div></aside><section class="panel span12"><div class="section"><h3>Paper Trading Simulator</h3><span class="muted">Fake money, real scanner prices</span></div><div class="paperGrid"><div><div class="predictForm" style="grid-template-columns:1fr 1fr auto auto"><input id="paperSymbol" class="input" placeholder="Ticker"><input id="paperAmount" class="input" placeholder="Fake dollars"><button id="paperBuyBtn" class="btn primary">Buy</button><button id="paperResetBtn" class="btn">Reset</button></div><div id="paperSummary" class="kpis" style="margin-top:10px"></div></div><div id="paperPositions" class="list"></div></div></section></section>
'''
          helpers = r'''
function safePaper(){try{return JSON.parse(localStorage.getItem('paperPortfolio')||'null')||{cash:10000,positions:{},history:[]}}catch(e){return{cash:10000,positions:{},history:[]}}}function savePaper(){localStorage.setItem('paperPortfolio',JSON.stringify(paper))}function allRanked(){return[...stockRecords(),...cryptoRecords()].sort((a,b)=>totalScore(b)-totalScore(a))}function hypeScore(r){const ni=newsImpactFor(r),move=Math.min(28,Math.abs(r.changePct)*4),volume=r.volume?Math.min(22,Math.log10(Math.max(10,r.volume))-5)*6:0,crypto=isCrypto(r.symbol)?10:0,news=Math.min(20,ni.count*5);return clamp(Math.round(24+move+volume+crypto+news),1,99)}function whaleActivity(r){const h=hypeScore(r),risk=riskScore(r),move=Math.abs(r.changePct);const score=clamp(Math.round(h*.45+risk*.35+move*4),1,99);return{score,label:score>=75?'Elevated':score>=55?'Active':'Calm',note:score>=75?'Large-move conditions. Volatility may increase.':score>=55?'Attention is rising. Use smaller fake trade sizes.':'No major volatility signal from the current free data.'}}function redFlagsFor(r){const flags=[];if(r.rsi>70)flags.push(['Overbought RSI','Price may be stretched.']);if(r.changePct>5)flags.push(['Sudden pump','Avoid chasing a fast move.']);if(r.changePct<-6)flags.push(['Sharp drop','Wait for buyers to stabilize it.']);if(riskScore(r)>72)flags.push(['High risk score','Position size should be smaller.']);if(hypeScore(r)>82&&riskScore(r)>65)flags.push(['Hype danger','Attention is high while risk is elevated.']);if(newsImpactFor(r).score<40)flags.push(['Bad news pressure','News tone is working against the setup.']);if((r.volume||0)<1000000&&!isCrypto(r.symbol))flags.push(['Low volume','Moves may be less reliable.']);return flags}function greenFlagsFor(r){const flags=[];if(totalScore(r)>75)flags.push('Strong total score');if(confidence(r)>72)flags.push('Good confidence');if(newsImpactFor(r).score>65)flags.push('Supportive news');if(signal(r).key==='dip')flags.push('Dip setup');if(histFor(r)?.trend==='uptrend')flags.push('Longer trend up');return flags}function verdictFor(r){const flags=redFlagsFor(r).length,total=totalScore(r),risk=riskScore(r);if(total>=72&&risk<70&&flags<3)return{label:'Watch',cls:'dip',why:`Strong score ${total}/99 with ${flags} red flag${flags===1?'':'s'}.`};if(risk>=78||flags>=4)return{label:'Avoid',cls:'peak',why:`Risk is high with ${flags} red flags. Wait for a cleaner chart.`};return{label:'Wait',cls:'neutral',why:'Not bad, but it needs better confirmation before it becomes a watch.'}}function simpleExplain(term){const d={RSI:'Shows if something may be too hot or too beaten down.',Trigger:'The price where the idea starts looking interesting.',Invalidation:'The price where the idea stops looking good.',Hype:'How much attention and fast movement the asset has.',Risk:'How dangerous the setup looks right now.',Whale:'A crypto volatility warning based on large moves and attention.'};return d[term]||term}function renderCommandDeck(all){if(!$('deckKpis'))return;document.body.classList.toggle('beginnerOn',beginnerMode);document.body.classList.toggle('beginnerOff',!beginnerMode);const ranked=allRanked(),best=ranked[0],hot=[...all].sort((a,b)=>hypeScore(b)-hypeScore(a))[0],risky=[...all].sort((a,b)=>redFlagsFor(b).length-redFlagsFor(a).length)[0],adv=all.length?Math.round(all.filter(r=>r.changePct>=0).length/all.length*100):0;$('beginnerBtn').textContent='Beginner Mode: '+(beginnerMode?'On':'Off');$('deckKpis').innerHTML=[metric('Market breadth',adv+'%',adv>=55?'up':adv<40?'down':'gold'),metric('Signal day',best?clean(best.symbol):'--','gold'),metric('Hype leader',hot?clean(hot.symbol)+' '+hypeScore(hot):'--','violet'),metric('Red flag watch',risky?clean(risky.symbol)+' '+redFlagsFor(risky).length:'--','down'),metric('Paper cash',money(paper.cash),'cyan')].join('');renderSignalDay(best);renderHeatWall(ranked);renderWhaleRadar(ranked);renderHypeRisk(ranked);renderRedFlags(risky||best);renderBeginnerNotes();renderPaper()}function renderSignalDay(r){if(!r){$('signalDay').innerHTML='<p class="muted">Waiting for scanner data.</p>';return}const v=verdictFor(r),p=predictionFor(r,100,'1w'),greens=greenFlagsFor(r);$('signalDay').innerHTML=`<div class="ideaHeader"><div><b class="sym">${clean(r.symbol)}</b><div class="muted">${esc(r.name||'')} | ${fmt(r.price)} <span class="${r.changePct>=0?'up':'down'}">${pct(r.changePct)}</span></div></div><div class="scoreBadge" style="--score:${totalScore(r)}">${totalScore(r)}</div></div><div class="pillRow" style="margin:10px 0"><span class="tag ${v.cls}">${v.label}</span><span class="tag neutral">Risk ${riskScore(r)}</span><span class="tag gold">Hype ${hypeScore(r)}</span>${newsImpactPill(newsImpactFor(r))}</div><p class="muted"><b>Why it matters:</b> ${whyInvest(r)} ${setupPlan(r).news}</p><p class="muted"><b>Estimated $100 path:</b> ${money(p.expected)} expected, possible upside ${money(p.gain)}, possible loss ${money(-p.loss)}.</p><div class="pillRow">${greens.map(g=>`<span class="tag dip">${esc(g)}</span>`).join('')||'<span class="tag neutral">Needs more confirmation</span>'}</div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="openAsset('${r.symbol}')">Open Details</button><button class="btn" onclick="quickPredict('${r.symbol}',100)">Predict $100</button></div>`}function renderHeatWall(ranked){$('heatWall').innerHTML=ranked.slice(0,32).map(r=>{const score=totalScore(r),risk=riskScore(r),tone=risk>75?'var(--red)':score>72?'var(--green)':score>55?'var(--gold)':'var(--blue)';return`<div class="heatTile" style="--glow:${score};--tone:${tone}" onclick="openAsset('${r.symbol}')"><div class="line"><b>${clean(r.symbol)}</b><span class="${r.changePct>=0?'up':'down'}">${pct(r.changePct)}</span></div><small>${verdictFor(r).label} | Score ${score}</small><small>Hype ${hypeScore(r)} | Risk ${risk}</small></div>`}).join('')}function renderWhaleRadar(ranked){const cryptos=ranked.filter(r=>isCrypto(r.symbol));$('whaleRadar').innerHTML=(cryptos.length?cryptos:ranked).slice(0,6).map(r=>{const w=whaleActivity(r);return`<div class="rowItem" onclick="openAsset('${r.symbol}')"><div><b>${clean(r.symbol)} ${w.label}</b><div class="muted">${w.note}</div></div><span class="tag ${w.score>=75?'peak':w.score>=55?'neutral':'dip'}">${w.score}</span></div>`}).join('')}function renderHypeRisk(ranked){$('hypeRisk').innerHTML=ranked.slice(0,6).map(r=>{const h=hypeScore(r),risk=riskScore(r),ver=h>75&&risk>70?'High attention, high danger':h>70?'High attention':risk<45?'Lower risk watch':'Balanced watch';return`<div class="rowItem" onclick="openAsset('${r.symbol}')"><div><b>${clean(r.symbol)}</b><div class="muted">${ver}</div></div><span>H ${h} / R ${risk}</span></div>`}).join('')}function renderRedFlags(r){if(!r){$('redFlags').innerHTML='<div class="flag muted">Waiting for data.</div>';return}const flags=redFlagsFor(r);$('redFlags').innerHTML=`<div class="flag"><strong>${clean(r.symbol)} has ${flags.length} red flag${flags.length===1?'':'s'}</strong><span class="muted">${flags.length?'Consider waiting for confirmation.':'No major red flags from current data.'}</span></div>`+(flags.length?flags.map(f=>`<div class="flag"><strong>${esc(f[0])}</strong><span class="muted">${esc(f[1])}</span></div>`).join(''):'')}function renderBeginnerNotes(){$('beginnerNotes').innerHTML=['RSI','Trigger','Invalidation','Hype','Risk','Whale'].map(t=>`<div class="rowItem"><b>${t}</b><span class="muted">${simpleExplain(t)}</span></div>`).join('')}async function analyzeTicker(){let raw=$('deckAnalyzeInput').value.trim();if(!raw)return;let sym=raw.toUpperCase().includes('-')?cryptoInput(raw):stockInput(raw);if(['BTC','ETH','SOL','DOGE','XRP'].includes(sym))sym=cryptoInput(sym);let r=bySym.get(sym);$('deckAnalyzeResult').innerHTML='<p class="muted">Analyzing '+esc(clean(sym))+'...</p>';if(!r){try{r=await fetchYahoo(sym);if(r)replaceRecord(r)}catch(e){}}if(!r){$('deckAnalyzeResult').innerHTML='<h3>No data found</h3><p class="muted">Try another ticker symbol.</p>';return}const v=verdictFor(r),flags=redFlagsFor(r);$('deckAnalyzeResult').innerHTML=`<h3>${clean(r.symbol)} Result: <span class="${v.cls}">${v.label}</span></h3><p class="muted">${v.why}</p><div class="stats"><div class="stat"><small>Total</small><b>${totalScore(r)}</b></div><div class="stat"><small>Hype</small><b>${hypeScore(r)}</b></div><div class="stat"><small>Risk</small><b>${riskScore(r)}</b></div><div class="stat"><small>Flags</small><b>${flags.length}</b></div></div><p class="muted">${setupPlan(r).entry}</p><button class="btn primary" onclick="openAsset('${r.symbol}')">Open Details</button>`;render()}function comparePair(a,b){const rows=[['Momentum',x=>x.changePct],['News',x=>newsImpactFor(x).score],['Risk',x=>-riskScore(x)],['Hype',x=>hypeScore(x)],['Overall',x=>totalScore(x)]];return rows.map(([label,fn])=>{const av=fn(a),bv=fn(b),winner=av>=bv?a:b;return{label,winner,scoreA:av,scoreB:bv}})}async function compareBattle(){let a=stockInput($('battleA').value||'TSLA'),b=stockInput($('battleB').value||'NVDA');let ra=bySym.get(a),rb=bySym.get(b);try{if(!ra){ra=await fetchYahoo(a);if(ra)replaceRecord(ra)}if(!rb){rb=await fetchYahoo(b);if(rb)replaceRecord(rb)}}catch(e){}if(!ra||!rb){$('battleResult').innerHTML='<div class="detailPanel muted">Could not load one of those tickers.</div>';return}const rows=comparePair(ra,rb),overall=rows.at(-1).winner;$('battleResult').innerHTML=`<div class="battleGrid">${rows.map(x=>`<div class="battleCell"><small class="muted">${x.label}</small><b>${clean(x.winner.symbol)}</b></div>`).join('')}</div><div class="detailPanel" style="margin-top:10px"><h3>Winner: ${clean(overall.symbol)}</h3><p class="muted">${clean(overall.symbol)} has the stronger setup because its total score, confirmation, or risk balance is better right now.</p></div>`}function paperValue(){return Object.entries(paper.positions||{}).reduce((sum,[sym,pos])=>sum+(bySym.get(sym)?.price||pos.avg||0)*pos.qty,paper.cash||0)}function paperBuy(){const raw=$('paperSymbol').value.trim().toUpperCase();const amount=parseMoney($('paperAmount').value);const sym=raw.includes('-')?cryptoInput(raw):stockInput(raw);const r=bySym.get(sym)||bySym.get(cryptoInput(sym));if(!r||!amount||amount>paper.cash)return;const qty=amount/r.price,pos=paper.positions[r.symbol]||{qty:0,avg:0};pos.avg=((pos.avg*pos.qty)+amount)/(pos.qty+qty);pos.qty+=qty;paper.positions[r.symbol]=pos;paper.cash-=amount;paper.history.push({time:Date.now(),type:'buy',symbol:r.symbol,amount});savePaper();renderPaper()}function paperSell(sym){const pos=paper.positions[sym],r=bySym.get(sym);if(!pos||!r)return;paper.cash+=pos.qty*r.price;delete paper.positions[sym];paper.history.push({time:Date.now(),type:'sell',symbol:sym});savePaper();renderPaper()}function resetPaper(){paper={cash:10000,positions:{},history:[]};savePaper();renderPaper()}function renderPaper(){if(!$('paperSummary'))return;const value=paperValue(),pnl=value-10000,positions=Object.entries(paper.positions||{});$('paperSummary').innerHTML=[metric('Fake value',money(value),pnl>=0?'up':'down'),metric('Fake cash',money(paper.cash),'cyan'),metric('Open positions',positions.length,'gold'),metric('P/L',money(pnl),pnl>=0?'up':'down'),metric('Style',positions.length>4?'Active':'Patient','violet')].join('');$('paperPositions').innerHTML=positions.length?positions.map(([sym,pos])=>{const r=bySym.get(sym),val=(r?.price||pos.avg)*pos.qty,pnl=val-pos.avg*pos.qty;return`<div class="rowItem"><div><b>${clean(sym)}</b><div class="muted">${pos.qty.toFixed(pos.qty>=10?2:4)} units | avg ${fmt(pos.avg)} | value ${money(val)}</div></div><div><span class="${pnl>=0?'up':'down'}">${money(pnl)}</span><button class="btn danger" onclick="paperSell('${sym}')">Sell</button></div></div>`}).join(''):'<div class="rowItem muted">No fake positions yet. Try buying $100 of a ticker from your watchlist.</div>'}function toggleBeginner(){beginnerMode=!beginnerMode;localStorage.setItem('beginnerMode',beginnerMode?'1':'0');renderCommandDeck([...stockRecords(),...cryptoRecords()])}
'''
          if 'deckPage' not in html:
              html = html.replace('</style></head>', deck_css + '</style></head>')
              html = html.replace("<button class=\"btn tab active\" onclick=\"showPage('stocks',this)\">Stocks</button><button class=\"btn tab\" onclick=\"showPage('crypto',this)\">Crypto</button>", "<button class=\"btn tab active\" onclick=\"showPage('stocks',this)\">Stocks</button><button class=\"btn tab\" onclick=\"showPage('deck',this)\">Command Deck</button><button class=\"btn tab\" onclick=\"showPage('crypto',this)\">Crypto</button>")
              html = html.replace('Live scanner dashboard</p><h2>Signals that are easier to read at a glance.</h2><p>Dark mode starts automatically. Stocks, crypto, watchlists, chart timestamps, backend logs, ranked setups, and Discord alert tracking live here.</p>', 'Market scanner command center</p><h2>Scan the market. Track the hype. Spot the risk.</h2><p>A research dashboard for stocks and crypto that turns messy market data, news tone, volatility, watchlists, and history into simple watch, wait, or avoid signals.</p>')
              html = html.replace('<button id="refreshBtn" class="btn">Refresh</button></div></div><aside', '<button id="refreshBtn" class="btn">Refresh</button><button class="btn" onclick="showPage(\'deck\')">Run Demo Scan</button></div></div><aside')
              html = html.replace('<h3>Scanner Mood</h3>', '<h3>Market Mood</h3>', 1)
              html = html.replace('<section id="stocksPage"', deck_page + '<section id="stocksPage"', 1)
          if 'paper=safePaper()' not in html:
              html = html.replace('scannerSize=0,cryptoSize=CRYPTO.length;', "scannerSize=0,cryptoSize=CRYPTO.length,paper=safePaper(),beginnerMode=localStorage.getItem('beginnerMode')==='1';")
          if 'renderCommandDeck(all);' not in html:
              html = html.replace('renderMood(all);renderKpis(stocks,cryptos);', 'renderMood(all);renderKpis(stocks,cryptos);renderCommandDeck(all);')
          mood_re = r"function renderMood\(all\).*?\nfunction renderKpis"
          mood_new = "function renderMood(all){if(!all.length)return;const a=avg(all),adv=all.filter(r=>r.changePct>=0).length/all.length*100,score=clamp(Math.round(50+a*6+(adv-50)*.35),1,99),best=[...all].sort((a,b)=>aiScore(b)-aiScore(a))[0],hot=[...all].sort((a,b)=>b.changePct-a.changePct)[0],label=score>=72?'Bullish':score>=56?'Cautiously Bullish':score>=42?'Neutral':score>=28?'Fearful':'Risky';$('scoreRing').style.setProperty('--score',score);$('moodScore').textContent=score;$('moodLabel').textContent=label;$('brief').innerHTML=`Today's market mood: <b>${label}</b>. Tech and crypto are being checked against trend, volatility, news tone, and red flags. Best setup: <b>${clean(best.symbol)}</b>. Strongest move: <b>${clean(hot.symbol)}</b> ${pct(hot.changePct)}.`}\nfunction renderKpis"
          html = re.sub(mood_re, mood_new, html, count=1)
          if 'function safePaper(){' not in html:
              html = html.replace('function renderAI(){', helpers + 'function renderAI(){', 1)
          if "$('deckAnalyzeBtn').onclick" not in html:
              html = html.replace("$('predictHorizon').onchange=()=>{renderPredictions([...stockRecords(),...cryptoRecords()]);if($('predictSymbol').value&&parseMoney($('predictAmount').value))runPrediction()};", "$('predictHorizon').onchange=()=>{renderPredictions([...stockRecords(),...cryptoRecords()]);if($('predictSymbol').value&&parseMoney($('predictAmount').value))runPrediction()};$('deckAnalyzeBtn').onclick=analyzeTicker;$('deckAnalyzeInput').onkeydown=e=>{if(e.key==='Enter')analyzeTicker()};$('battleBtn').onclick=compareBattle;$('beginnerBtn').onclick=toggleBeginner;$('paperBuyBtn').onclick=paperBuy;$('paperResetBtn').onclick=resetPaper;$('paperSymbol').onkeydown=e=>{if(e.key==='Enter')paperBuy()};$('paperAmount').onkeydown=e=>{if(e.key==='Enter')paperBuy()};")
              html = html.replace('window.quickPredict=quickPredict;', 'window.quickPredict=quickPredict;window.refreshLivePrices=refreshLivePrices;window.analyzeTicker=analyzeTicker;window.compareBattle=compareBattle;window.paperSell=paperSell;window.resetPaper=resetPaper;window.toggleBeginner=toggleBeginner;')
          path.write_text(html, encoding='utf-8')
          PY
      - name: Commit applied patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-command-deck.yml
          git add index.html
          git commit -m "Add market command deck features" || exit 0
          git push
