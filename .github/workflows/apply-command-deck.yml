name: Apply Command Deck Upgrade
on:
  push:
    paths:
      - .github/workflows/apply-command-deck.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover patch script
        run: |
          python - <<'PY'
          from pathlib import Path
          import urllib.request
          url = 'https://raw.githubusercontent.com/test23780460/test11/1e8fa50165d69e7262180d3da1f9fd6e28e40454/.github/workflows/apply-command-deck.yml'
          raw = urllib.request.urlopen(url, timeout=30).read().decode('utf-8')
          start = raw.index('          from pathlib import Path')
          end = raw.index('          PY', start)
          code_lines = []
          for line in raw[start:end].splitlines():
              code_lines.append(line[10:] if line.startswith('          ') else line)
          Path('apply_command_deck.py').write_text('\n'.join(code_lines) + '\n', encoding='utf-8')
          PY
      - name: Apply patch
        run: python apply_command_deck.py
      - name: Commit applied patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-command-deck.yml
          git add index.html
          git commit -m "Add market command deck features" || exit 0
          git push
