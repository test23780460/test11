name: Patch alert cooldown

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-alert-cooldown.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch alert logic
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          path = Path('scripts/update-stock-data.js')
          lines = path.read_text().splitlines()

          fired_line = "    fired.push({ symbol: r.symbol, timestamp, aiScore: aiScore(r), confidence: confidence(r), price: r.price, changePct: r.changePct, rsi: r.rsi });"
          sent_line = "    state.sent[r.symbol] = timestamp;"

          if lines.count(fired_line) and lines.index(fired_line) < lines.index("    if (webhook) {"):
              i = lines.index(fired_line)
              del lines[i:i+3]
              start = lines.index("    if (webhook) {")
              else_i = next(j for j in range(start, len(lines)) if lines[j] == "    } else {")
              lines[else_i:else_i] = [fired_line, sent_line]
              path.write_text("\n".join(lines) + "\n")
          elif not lines.count(fired_line):
              raise SystemExit('alert lines not found')

          alerts_path = Path('data/alerts.json')
          if alerts_path.exists():
              alerts = json.loads(alerts_path.read_text())
              alerts['sent'] = {}
              alerts['lastFired'] = []
              alerts_path.write_text(json.dumps(alerts, indent=2) + "\n")
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/update-stock-data.js data/alerts.json
          git commit -m "Fix Discord alert cooldown tracking" || exit 0
          git push
# trigger: python-patch
