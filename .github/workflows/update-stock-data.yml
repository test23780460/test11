name: Update stock data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update-stock-data.js
      - .github/workflows/update-stock-data.yml
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/update-stock-data.js
      - name: Commit refreshed data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update stock market data
          file_pattern: prices.json prices.csv data/market.json data/market.csv data/history.json data/history.csv
