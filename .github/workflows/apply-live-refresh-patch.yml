name: Apply live refresh patch

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/apply-live-refresh-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch live refresh
        run: python .github/scripts/live_refresh_patch.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add faster live price refresh" || exit 0
          git push
