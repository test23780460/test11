name: Apply predictions patch
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/apply-predictions-patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: python .github/scripts/add_predictions.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add market predictions calculator" || exit 0
          git push
