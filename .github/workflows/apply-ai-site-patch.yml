name: Apply AI site patch

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/apply-ai-site-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch AI site
        run: python .github/scripts/ai_site_patch.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add real AI market brief page" || exit 0
          git push
# trigger: ai-site
